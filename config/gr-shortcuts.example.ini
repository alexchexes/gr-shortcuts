; ------------------------------------------------------------------------------
; Generic modifier aliases
; ------------------------------------------------------------------------------
; Generic modifier names catch either left or right key.
; Do not use both generic and left/right mappings for the same modifier unless you really want both.
; Control=cc:111
; Alt=cc:112
; Shift=cc:113

; ------------------------------------------------------------------------------
; Key combinations
; ------------------------------------------------------------------------------
; AutoHotkey combo symbols:
; ^ = Ctrl, ! = Alt, + = Shift, # = Windows key
; < or > before a modifier means left or right side, for example <^ is left Ctrl.
; Be careful with Alt or Windows-key combos, because they may interfere with normal Windows shortcuts.
; ^1=cc:36
; ^2=cc:37
; ^Space=cc:38
; +Space=cc:39
; <^1=cc:25
; >^1=cc:26

