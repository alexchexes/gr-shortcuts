; This is the default config template.
; setup.ps1 copies this file to config\gr-shortcuts.ini only when gr-shortcuts.ini is missing.
; Edit config\gr-shortcuts.ini after running setup.ps1.
; Use AutoHotkey key names in [Mappings], for example Space, Left, Right, 1, F1.
; MIDI CC and Program Change numbers must be between 0 and 127.

[App]
GuitarRigExe=%ProgramFiles%\Native Instruments\Guitar Rig 7\Guitar Rig 7.exe
GuitarRigArgs=
GuitarRigWindow=ahk_exe Guitar Rig 7.exe
GuitarRigProcess=Guitar Rig 7.exe
LoopMidiExe=
ReuseRunningGuitarRig=1
ActivateGuitarRigOnStart=1
CloseMapperWithGuitarRig=1
; Closes loopMIDI only if this mapper started it. Existing loopMIDI sessions are left alone.
CloseLoopMidiWithMapper=1

[MIDI]
Port=GR7 Control
SendMidiPath=tools\sendmidi\sendmidi.exe
Channel=1
; Used only by pulse:N mappings.
PulseMs=40

[Mappings]
; Uncomment lines for keys you want to use for Guitar Rig mapping.
; Enabled keys are captured while the Guitar Rig window is focused, so they will
; not behave as normal keyboard input in Guitar Rig or Windows shortcuts.
; For example, if you enable Alt, Alt+Tab may stop working while Guitar Rig is focused.

; CC (Continuous Controller) numbers:
; The default numbers used here are unique, so you can uncomment any key and use it
; without searching for a free number.
; However, if you want two physical keys on your keyboard to trigger the same action in Guitar Rig,
; or if you want to preserve existing MIDI mappings from another controller,
; you can change the numbers yourself to any value you want (the MIDI CC range is 0-127).
; cc:N sends one MIDI CC message with value 127.
; cc:N:V sends one MIDI CC message with a specific value, for example cc:20:64.
; toggle:N alternates between values 127 and 0. This is useful for Play/Pause or bypass-style controls.
; toggle:N:0 starts with value 0 instead of 127.
; pulse:N sends value 127 and then value 0. This is useful for momentary controls such as Stop.
; pc:N sends MIDI Program Change N. Use it only for MIDI targets that support Program Change.
;
; Guitar Rig MIDI Learn manual:
; https://www.native-instruments.com/ni-tech-manuals/guitar-rig-manual/en/automation-and-midi-control
; Guitar Rig keyboard shortcuts manual:
; https://www.native-instruments.com/ni-tech-manuals/guitar-rig-manual/en/keyboard-shortcuts

